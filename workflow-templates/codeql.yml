name: CodeQL

# Omni-FI canonical advanced CodeQL. See CI_CONVENTIONS.md in this repo.
# Single matrix-free analysis so the check name is uniformly `Analyze` across repos.
# NOTE: only use this advanced workflow if the repo does NOT use GitHub's default
# code-scanning setup — the two conflict. Set `languages` to your stack
# (javascript-typescript, python, ...).

on:
  push:
    branches: [$default-branch, staging]
  pull_request:
    branches: [$default-branch, staging]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Code scanning (CodeQL SARIF upload) requires GitHub Code Security, which is
    # free on public repos but paid per-committer on private ones. Skip on private
    # repos to avoid the billed feature; auto-activates if the repo ever goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:javascript-typescript'
