name: CI

# Omni-FI canonical CI (Bun). See CI_CONVENTIONS.md in this repo for the rules.
# Edit the Lint / Test / Build phases for your project; keep the job named `CI`,
# the action SHAs pinned (with version comments), and Bun + Node pinned.

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pin Node (toolchains run under system Node via bin shebangs). Commit a .nvmrc.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
